<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D施工検討Viewer Kasane</title>
    <!-- アイコンは使わない。指定しないと /favicon.ico を取りに行き 404 が出る -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <!-- ツールバー: 開いているプロジェクトと、作業のモード（ツール）だけを置く。見え方の切替は 3D 画面の左上 -->
      <header id="toolbar" role="toolbar" aria-label="操作">
        <span class="brand">3D施工検討Viewer Kasane</span>
        <button id="current-title" class="current-title" aria-haspopup="dialog" aria-expanded="false" aria-controls="site-panel" title="プロジェクト・版を開く・取り込む">
          <span id="current-name">プロジェクトを選んでください</span> ▾
        </button>
        <!-- ボタンは登録されたツールから作る（src/modes/builtinTools.ts・src/tools/toolRegistry.ts） -->
        <div id="tool-group" class="group" role="group" aria-label="ツール"></div>
        <div class="toolbar-end">
          <button id="btn-help" title="操作キーの一覧（F1）" aria-label="操作キーの一覧">?</button>
          <button id="btn-settings" title="表示名・保存先（プロジェクトフォルダ・設定データフォルダ）">設定</button>
        </div>
      </header>
      <!-- プロジェクト・版の一覧と取込（ツールバーのプロジェクト名から開く） -->
      <div id="site-panel" class="popover hidden" role="dialog" aria-label="プロジェクト・版"></div>

      <!-- 左: 何を見ているか（レイヤー）と、作業で残ったもの（計測・指摘・差分） -->
      <aside id="left">
        <!-- 折りたたんだときは細い帯だけ残す（押すと開く） -->
        <button class="panel-strip" data-panel="left" aria-controls="left" aria-expanded="true" title="左のパネルを開く">
          <span aria-hidden="true">»</span><span class="strip-label">レイヤー・計測・指摘・差分</span>
        </button>
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="layers" class="active">レイヤー</button>
          <button role="tab" data-tab="measures">計測 <span id="measure-count" class="badge"></span></button>
          <button role="tab" data-tab="issues">指摘 <span id="issue-count" class="badge"></span></button>
          <button role="tab" data-tab="diff">差分</button>
          <button class="panel-close" data-panel="left" aria-controls="left" title="左のパネルを折りたたむ（3D 画面を広げる）" aria-label="左のパネルを折りたたむ">«</button>
        </nav>
        <section id="tab-layers" class="tab active" role="tabpanel"></section>
        <section id="tab-measures" class="tab" role="tabpanel"></section>
        <section id="tab-issues" class="tab" role="tabpanel"></section>
        <section id="tab-diff" class="tab" role="tabpanel"></section>
      </aside>

      <main id="view">
        <!-- どう見えているか（視点・投影・切断・目印） -->
        <div id="view-bar" class="view-bar" role="toolbar" aria-label="見え方">
          <div class="menu-wrap">
            <button id="btn-view" class="needs-data" aria-haspopup="menu" aria-expanded="false" title="視点を切り替える（方位の軸を押しても切り替わります）">視点 ▾</button>
            <div class="menu hidden" role="menu" aria-label="視点">
              <button role="menuitem" data-view="iso" title="斜め上から全体を見る（前・右はこの視点が基準）">斜め上から</button>
              <button role="menuitem" data-view="top" title="真上から見下ろす（小地図と同じ向き）">平面</button>
              <button role="menuitem" data-view="front" title="前（−Y 側）から +Y 方向を見る">正面</button>
              <button role="menuitem" data-view="back" title="後ろ（+Y 側）から −Y 方向を見る">背面</button>
              <button role="menuitem" data-view="left" title="左（−X 側）から +X 方向を見る">左側面</button>
              <button role="menuitem" data-view="right" title="右（+X 側）から −X 方向を見る">右側面</button>
            </div>
          </div>
          <button id="btn-projection" class="needs-data" aria-pressed="false" title="平行投影（遠近なし）と透視を切り替える（P）">平行投影</button>
          <div class="menu-wrap">
            <button id="btn-clip" class="needs-data" aria-haspopup="menu" aria-expanded="false" title="切断ボックス・断面（足す・オフはここ、調整は右のパネル）">切断: なし ▾</button>
            <!-- 切断を足す・全部オフ・枠の表示はここだけ。右のパネルは今ある切断の調整だけ -->
            <div class="menu menu-wide hidden" role="menu" aria-label="切断">
              <label class="menu-check" role="menuitemcheckbox" aria-checked="false" title="見たい範囲を箱で切り出す"><input type="checkbox" id="chk-clip-box" />切断ボックス</label>
              <div class="menu-sep" role="separator"></div>
              <button role="menuitem" data-add-section="z" title="今見ている所の高さで水平に切る（上を消す）">水平断面を追加</button>
              <button role="menuitem" data-add-section="x" title="今見ている所を通り、X 軸に直交する面で切る">垂直断面を追加（X）</button>
              <button role="menuitem" data-add-section="y" title="今見ている所を通り、Y 軸に直交する面で切る">垂直断面を追加（Y）</button>
              <button role="menuitem" id="btn-add-face-section" title="モデルの面・点群の平らな所・3点をクリックして、その面に平行に切る">面に合わせて断面を追加…</button>
              <div class="menu-sep" role="separator"></div>
              <label class="menu-check" role="menuitemcheckbox" aria-checked="true" title="箱の枠・断面の目印を出す。隠しても切断は効いたまま（B）"><input type="checkbox" id="chk-clip-guides" checked />枠を表示する（B）</label>
              <button role="menuitem" id="btn-clip-off" title="切断ボックスと断面をすべてオフにする（断面は右のパネルの一覧に残ります）">切断をすべてオフ</button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="btn-nav" class="needs-data" aria-haspopup="menu" aria-expanded="false" title="位置の目印・小地図">目印 ▾</button>
            <div id="nav-menu" class="menu menu-wide hidden" role="menu" aria-label="位置の目印"></div>
          </div>
        </div>
        <div id="hint" class="hint" aria-live="polite"></div>
        <div id="empty-view" class="empty-view hidden"></div>
        <div id="loading" class="loading hidden" aria-live="polite"></div>
      </main>

      <!-- 右: いま何をしているか（選んだツールの設定と結果、切断の設定） -->
      <aside id="right">
        <button class="panel-strip" data-panel="right" aria-controls="right" aria-expanded="true" title="右のパネルを開く">
          <span aria-hidden="true">«</span><span id="right-strip-label" class="strip-label">属性</span>
        </button>
        <button class="panel-close" data-panel="right" aria-controls="right" title="右のパネルを折りたたむ（3D 画面を広げる）" aria-label="右のパネルを折りたたむ">»</button>
        <section id="props"></section>
        <section id="tool-opts" class="hidden"></section>
        <section id="clip-panel" class="clip-panel hidden"></section>
      </aside>

      <footer id="status" aria-live="polite">
        <span id="st-coord">座標 —</span>
        <span id="st-points"></span>
        <span id="st-fps"></span>
        <button id="st-msg" class="status-link hidden"></button>
        <button id="st-root" class="status-link" title="保存先（クリックで設定を開く）"></button>
        <span id="st-user"></span>
      </footer>
    </div>

    <div id="drop-overlay" class="hidden">E57・IFC をドロップして取り込む</div>
    <dialog id="dlg-import"></dialog>
    <dialog id="dlg-issue"></dialog>
    <dialog id="dlg-settings" aria-label="設定"></dialog>
    <dialog id="dlg-help" aria-label="操作キーの一覧"></dialog>
    <dialog id="dlg-message"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
