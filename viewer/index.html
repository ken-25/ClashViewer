<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>干渉ビューア</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar" role="toolbar" aria-label="操作">
        <span class="brand">干渉ビューア</span>
        <span id="current-title" class="current-title">データセットを選んでください</span>
        <div class="group" role="group" aria-label="ツール">
          <button data-tool="select" class="active" title="要素を選んで属性を見る（Esc）">選択</button>
          <button data-tool="measure" title="2点間の距離">計測</button>
          <button data-tool="ortho" title="局所座標の X/Y/Z 方向だけを測る">直交計測</button>
          <button data-tool="origin" title="1点目=原点、2点目=X軸の向き">原点設定</button>
          <button data-tool="issue" title="クリックした位置に指摘を登録">指摘登録</button>
          <button data-tool="align" title="モデルと点群の対応する3点で合わせる">3点合わせ</button>
        </div>
        <div class="group" role="group" aria-label="切断">
          <button data-clip="none" class="active">切断なし</button>
          <button data-clip="box">切断ボックス</button>
          <button data-clip="section">断面</button>
        </div>
        <div class="group" role="group" aria-label="視点">
          <button data-view="iso" title="斜め上から全体を見る（前・右はこの視点が基準）">全体</button>
          <button data-view="top" title="真上から見下ろす（平面図の向き）">上から</button>
          <button data-view="front" title="前（−Y 側）から +Y 方向を見る">前から</button>
          <button data-view="back" title="後ろ（+Y 側）から −Y 方向を見る">後ろから</button>
          <button data-view="left" title="左（−X 側）から +X 方向を見る">左から</button>
          <button data-view="right" title="右（+X 側）から −X 方向を見る">右から</button>
        </div>
      </header>

      <aside id="left">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="data" class="active">データ</button>
          <button role="tab" data-tab="display">表示</button>
          <button role="tab" data-tab="issues">指摘 <span id="issue-count" class="badge"></span></button>
          <button role="tab" data-tab="diff">差分</button>
        </nav>
        <section id="tab-data" class="tab active" role="tabpanel"></section>
        <section id="tab-display" class="tab" role="tabpanel"></section>
        <section id="tab-issues" class="tab" role="tabpanel"></section>
        <section id="tab-diff" class="tab" role="tabpanel"></section>
      </aside>

      <main id="view">
        <div id="hint" class="hint" aria-live="polite"></div>
        <div id="loading" class="loading hidden" aria-live="polite"></div>
        <div id="tool-panel" class="tool-panel hidden"></div>
      </main>

      <aside id="right">
        <section id="props"><h2>属性</h2><p class="muted">モデル要素をクリックすると属性を表示します。</p></section>
        <section id="measures"></section>
      </aside>

      <footer id="status" aria-live="polite">
        <span id="st-coord">座標 —</span>
        <span id="st-points"></span>
        <span id="st-fps"></span>
        <span id="st-msg"></span>
        <span id="st-user"></span>
      </footer>
    </div>

    <div id="drop-overlay" class="hidden">E57・IFC をドロップして取り込む</div>
    <dialog id="dlg-import"></dialog>
    <dialog id="dlg-issue"></dialog>
    <dialog id="dlg-message"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
